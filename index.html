<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fulton 2031 — Capital Planning Simulation</title>
<style>
:root{
  --maroon:#6B1730; --maroon-dk:#4A0F20; --gold:#FFC627; --paper:#F7F5F1;
  --ink:#211C1E; --slate:#5B5560; --line:#DAD3CB; --card:#FFFFFF;
  --ok:#3D6B4F; --warn:#B4791F; --crit:#A23B2E; --font-serif:Georgia,'Times New Roman',serif;
  --font-sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#1B1719;--ink:#EFEAE6;--slate:#B8AFAF;--line:#3A3235;--card:#241F21;}
}
:root[data-theme="dark"]{--paper:#1B1719;--ink:#EFEAE6;--slate:#B8AFAF;--line:#3A3235;--card:#241F21;}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);line-height:1.5;}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px;}
.layout{display:block;}
.sidebar{margin-top:0;}
@media (min-width:860px){
  .layout{display:grid;grid-template-columns:1fr 230px;gap:22px;align-items:start;}
  .sidebar{position:sticky;top:16px;}
}
h1,h2,h3{font-family:var(--font-serif);font-weight:700;margin:0 0 8px;}
h1{font-size:1.7rem;} h2{font-size:1.3rem;} h3{font-size:1.05rem;}
.masthead{border-bottom:2px solid var(--maroon);padding-bottom:14px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
.masthead .tag{font-size:.78rem;color:var(--slate);}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px;margin-bottom:18px;}
.card ul{margin:8px 0 0;padding-left:20px;}
.card ul li{margin-bottom:6px;line-height:1.5;}
.card ul li:last-child{margin-bottom:0;}
.field{margin-bottom:14px;}
label{display:block;font-size:.85rem;color:var(--slate);margin-bottom:5px;}
input[type=text]{width:100%;padding:9px 10px;font-size:1rem;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);font-family:var(--font-sans);}
button{font-family:var(--font-sans);font-weight:600;font-size:.92rem;padding:11px 20px;border-radius:3px;border:1px solid var(--maroon);background:var(--maroon);color:#fff;cursor:pointer;}
button:hover{background:var(--maroon-dk);}
button:disabled{opacity:.45;cursor:not-allowed;}
.opt{border:2px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:border-color .15s,background .15s;display:flex;gap:12px;align-items:flex-start;}
.opt:hover{border-color:var(--maroon);background:rgba(107,23,48,.05);}
.opt.chosen{border-color:var(--maroon);border-width:2px;background:rgba(107,23,48,.08);}
.opt .radio{font-size:1.1rem;line-height:1.3;color:var(--maroon);flex-shrink:0;margin-top:1px;}
.opt .body h4{margin:0 0 4px;font-size:.98rem;}
.opt .body p{margin:0;font-size:.87rem;color:var(--slate);}
.stat-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;margin-bottom:12px;}
.stat-label{font-size:.85rem;}
.stat-val{font-size:.9rem;font-weight:600;text-align:right;}
.stat-context{grid-column:1/-1;font-size:.75rem;color:var(--slate);}
.bar{grid-column:1/-1;height:7px;background:var(--line);border-radius:4px;overflow:hidden;}
.bar > i{display:block;height:100%;}
.ok{color:var(--ok);} .warn{color:var(--warn);} .crit{color:var(--crit);}
.bar-ok{background:var(--ok);} .bar-warn{background:var(--warn);} .bar-crit{background:var(--crit);}
.dash{display:flex;justify-content:space-between;font-size:.82rem;color:var(--slate);margin-bottom:16px;flex-wrap:wrap;gap:6px;}
.slider-row{margin-bottom:16px;}
.slider-row .top{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px;}
.bucket-btn{width:30px;height:30px;padding:0;font-size:1.1rem;line-height:1;border-radius:50%;flex-shrink:0;margin:4px auto;display:block;}
.remain{font-family:var(--font-serif);font-size:1.05rem;text-align:right;margin:8px 0 18px;}
.note{font-size:.8rem;color:var(--slate);border-left:2px solid var(--gold);padding-left:10px;margin:14px 0;}
.keyinfo{font-size:1.08rem;font-weight:600;color:var(--ink);border-left:3px solid var(--maroon);padding-left:12px;margin:16px 0;line-height:1.5;}
.event{border-left:3px solid var(--maroon);padding:10px 14px;margin-bottom:10px;background:var(--paper);}
.event.bad{border-color:var(--crit);} .event.good{border-color:var(--ok);}
.cert{border:3px double var(--maroon);padding:30px;text-align:center;}
.cert h1{font-size:1.5rem;} .cert .role{color:var(--slate);margin-bottom:20px;}
.cert-grid{text-align:left;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:20px 0;}
.verdict{font-family:var(--font-serif);font-size:1.4rem;margin:16px 0;}
.pass{color:var(--ok);} .fail{color:var(--crit);}
.hook{padding:8px 4px 4px;}
.hook p{font-family:var(--font-serif);font-size:1.15rem;margin:0 0 14px;opacity:0;animation:rise .6s ease forwards;}
.hook p.big{font-size:1.6rem;font-weight:700;color:var(--maroon);}
.budget-visual{position:relative;height:230px;margin:6px 0 20px;}
.budget-visual.mini{height:auto;max-width:340px;margin:1.6em auto 4px;display:flex;justify-content:center;align-items:flex-end;gap:32px;}
.budget-visual.mini .pile,.budget-visual.mini .bucket{position:static;transform:none;width:auto;}
.budget-visual.mini .pile-icon{font-size:3.6rem;}
.budget-visual.mini .pile-label{font-size:.85rem;margin-top:8px;}
.pile{position:absolute;left:0;bottom:0;width:16%;text-align:center;}
.pile-icon{font-size:2.4rem;line-height:1;}
.pile-label{font-size:.72rem;color:var(--slate);margin-top:4px;font-weight:600;}
.bucket{position:absolute;bottom:0;transform:translateX(-50%);width:90px;text-align:center;display:flex;flex-direction:column;align-items:center;}
.bucket-icon{font-size:1.7rem;line-height:1;}
.bucket-track{width:18px;height:60px;background:var(--paper);border:1px solid var(--line);border-radius:4px;margin:4px auto 0;display:flex;align-items:flex-end;overflow:hidden;}
.bucket-fill{width:100%;height:0%;background:var(--maroon);transition:height .35s ease;}
.bucket-caption{font-size:.68rem;color:var(--slate);margin-top:4px;min-height:28px;}
.bucket-amt{font-size:.78rem;font-weight:700;}
.keep-control{display:flex;flex-direction:column;align-items:center;}
.keep-row{display:flex;align-items:center;gap:14px;}
.keep-row .bucket-btn{margin:0;width:46px;height:46px;font-size:1.6rem;}
.keep-track{width:150px;height:24px;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.keep-fill{height:100%;width:0%;background:var(--maroon);transition:width .35s ease;}
.keep-icon{font-size:2.4rem;line-height:1;}
.keep-control .bucket-caption{font-size:.85rem;margin-top:10px;min-height:0;}
.keep-control .bucket-amt{font-size:1.05rem;margin-top:2px;}
.flying-dollar{position:absolute;transform:translate(-50%,-50%);font-weight:700;color:var(--ok);pointer-events:none;transition:left .55s ease, top .55s ease, opacity .55s ease;opacity:1;z-index:5;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hook p.big{color:var(--gold);}}
:root[data-theme="dark"] .hook p.big{color:var(--gold);}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){.hook p{animation:none;opacity:1;}}
body.hook-seen .hook p{animation:none;opacity:1;}
@media (max-width: 600px){
  body{zoom:0.75;}
}

/* Full-screen phone experience: visual layer only */
.phone-overlay{position:fixed;inset:0;z-index:9999;background:#111;display:flex;align-items:stretch;justify-content:center;min-height:100dvh;color:#fff;font-family:var(--font-sans);overflow:auto;}
.phone-screen{width:100%;min-height:100dvh;background:linear-gradient(180deg,#1c2530 0%,#101419 58%,#090b0e 100%);padding:max(18px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center;}
.phone-status{width:100%;max-width:560px;display:flex;justify-content:space-between;font-size:.78rem;opacity:.75;margin-bottom:5vh;}
.boss-avatar{width:min(42vw,190px);height:min(42vw,190px);border-radius:50%;overflow:hidden;background:#f0c9a4;border:5px solid rgba(255,255,255,.18);box-shadow:0 16px 45px rgba(0,0,0,.35);flex:none;}
.boss-avatar.small{width:88px;height:88px;border-width:3px;}
.boss-name{font-size:clamp(2rem,8vw,3.4rem);font-weight:650;margin:20px 0 2px;letter-spacing:-.03em;}
.call-label{font-size:1rem;opacity:.65;margin-bottom:auto;}
.call-actions{width:100%;max-width:430px;display:flex;justify-content:space-between;gap:36px;margin-top:8vh;padding:0 12px 5vh;}
.call-action{background:transparent!important;border:0!important;padding:0!important;color:#fff!important;min-width:0!important;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:.82rem;}
.call-circle{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:2rem;box-shadow:0 8px 24px rgba(0,0,0,.3);}
.call-circle.red{background:#e5484d}.call-circle.green{background:#39b95a}
.phone-shake{animation:phoneShake 1.35s ease-in-out 1 both;}
@keyframes phoneShake{0%,12%,24%,36%,48%,60%,72%,84%,100%{transform:translateX(0) rotate(0)}6%,30%,54%{transform:translateX(-9px) rotate(-1deg)}18%,42%,66%{transform:translateX(9px) rotate(1deg)}}
.phone-header{width:100%;max-width:620px;text-align:left;margin-bottom:20px}.phone-header h1{font-family:var(--font-sans);font-size:2rem;margin:8px 0;color:#fff}.phone-header p{margin:0;opacity:.58}
.recents{width:100%;max-width:620px;background:rgba(255,255,255,.07);border-radius:22px;overflow:hidden;text-align:left;}
.recent-row{display:grid;grid-template-columns:58px 1fr auto;gap:13px;align-items:center;padding:18px;border-bottom:1px solid rgba(255,255,255,.1)}
.recent-icon{width:54px;height:54px;border-radius:50%;background:#303944;display:grid;place-items:center;font-size:1.35rem}.missed{color:#ff5b61}.recent-name{font-size:1.05rem;font-weight:700}.recent-meta{font-size:.8rem;opacity:.55}.recent-time{font-size:.82rem;opacity:.6}
.voicemail-btn{width:100%;max-width:620px;margin-top:18px;border:0!important;border-radius:18px!important;background:rgba(255,255,255,.1)!important;color:#fff!important;padding:17px 18px!important;display:flex;align-items:center;gap:14px;text-align:left;font-size:1rem!important}.play-dot{width:44px;height:44px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;flex:none}
.voicemail-card{width:100%;max-width:620px;background:rgba(255,255,255,.08);border-radius:24px;padding:22px;margin:20px 0;text-align:left}.voicemail-card p{font-size:1.02rem;line-height:1.6;margin:12px 0 0}.worried{font-size:3rem;margin-top:6px}.normal-day{width:100%;max-width:620px;margin-top:auto;border-radius:16px!important;background:#fff!important;color:#111!important;border:0!important;padding:16px!important;font-size:1rem!important}
@media (min-width:700px){.phone-screen{max-width:760px;box-shadow:0 0 80px rgba(0,0,0,.7)}}


/* Zoom-style answered-call experience */
.zoom-shell{position:fixed;inset:0;z-index:10000;background:#17191d;color:#fff;display:flex;flex-direction:column;min-height:100dvh;font-family:var(--font-sans);}
.zoom-topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#202226;border-bottom:1px solid #34363b;font-size:.82rem;}
.zoom-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 18px 112px;overflow:auto;}
.zoom-video{width:min(94vw,760px);min-height:min(56vh,540px);border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#2b3037,#171a1f);position:relative;box-shadow:0 22px 70px rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;}
.zoom-video .zoom-portrait{width:min(58vw,350px);height:min(58vw,350px);border-radius:50%;overflow:hidden;box-shadow:0 14px 45px rgba(0,0,0,.35);background:#ddd;}
.zoom-nameplate{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.62);padding:7px 11px;border-radius:7px;font-weight:700;font-size:.86rem;}
.zoom-live{position:absolute;right:14px;top:14px;background:#d93025;padding:5px 9px;border-radius:6px;font-size:.72rem;font-weight:800;letter-spacing:.04em;}
.zoom-dialogue{width:min(94vw,760px);margin-top:14px;background:#24272d;border:1px solid #3b3e45;border-radius:16px;padding:16px 18px;text-align:left;line-height:1.55;}
.zoom-dialogue strong{display:block;margin-bottom:5px;color:#dfe7ff;}
.zoom-choices{width:min(94vw,760px);display:grid;gap:10px;margin-top:12px;}
.zoom-choice{width:100%;text-align:left;border:1px solid #4a4e56!important;background:#2b2f36!important;color:#fff!important;border-radius:13px!important;padding:14px 15px!important;}
.zoom-choice:hover{background:#353a43!important;}
.zoom-choice small{display:block;opacity:.68;margin-top:4px;font-weight:400;line-height:1.35;}
.zoom-toolbar{position:fixed;left:0;right:0;bottom:0;z-index:10001;background:#202226;border-top:1px solid #35383e;min-height:82px;padding:10px max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:18px;align-items:center;}
.zoom-tool{background:transparent!important;border:0!important;color:#fff!important;padding:6px 10px!important;font-size:.74rem!important;display:flex;flex-direction:column;align-items:center;gap:4px;}.zoom-tool span{font-size:1.25rem}
/* Once a decision has been made on the call, the way out should be obvious and unmissable —
   a large, centered "End Call" button in the middle of the stage, not a small icon tucked into
   the toolbar alongside Mute/Video. */
.zoom-leave-big{margin-top:22px;padding:18px 52px!important;font-size:1.15rem!important;font-weight:700!important;border-radius:14px!important;border:0!important;background:#d93025!important;color:#fff!important;box-shadow:0 12px 32px rgba(217,48,37,.4);}
.zoom-leave-big:hover{background:#b8261c!important;}
@media(max-width:600px){.zoom-leave-big{width:92vw;padding:16px 20px!important;}}
@media(max-width:600px){.zoom-stage{padding:12px 10px 104px}.zoom-video{width:96vw;min-height:48vh;border-radius:12px}.zoom-dialogue,.zoom-choices{width:96vw}.zoom-video .zoom-portrait{width:min(68vw,310px);height:min(68vw,310px)}}

/* Breaking-news / "Extra Extra" style alert for the external (natural or political) event —
   deliberately a different visual language from the phone-call screens, so it reads as an
   outside development rather than someone calling the learner. */
.news-overlay{position:fixed;inset:0;z-index:9999;background:#0b0b0c;display:flex;align-items:center;justify-content:center;padding:24px;font-family:var(--font-sans);color:#fff;overflow:auto;min-height:100dvh;}
.news-shell{width:100%;max-width:640px;background:#151515;border-radius:14px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid #2a2a2a;}
.news-topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:#000;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;}
.news-live-dot{color:#ff4d4d;font-weight:800;}
.news-live-dot::before{content:'●';margin-right:5px;animation:newsBlink 1.4s ease-in-out infinite;}
@keyframes newsBlink{0%,100%{opacity:1;}50%{opacity:.25;}}
.news-banner{background:#c1121f;color:#fff;text-align:center;font-weight:900;letter-spacing:.09em;padding:12px 10px;font-size:1.35rem;text-transform:uppercase;font-family:var(--font-sans);}
.news-body{padding:34px 26px 26px;text-align:center;}
.news-icon{font-size:3.2rem;margin-bottom:12px;line-height:1;}
.news-headline{font-family:var(--font-serif);font-size:2.1rem;font-weight:800;margin:0 0 14px;letter-spacing:.01em;color:#fff;}
.news-sub{opacity:.82;font-size:1rem;line-height:1.55;max-width:440px;margin:0 auto;}
.news-ticker{background:#c1121f;overflow:hidden;white-space:nowrap;padding:9px 0;}
.news-ticker span{display:inline-block;padding-left:100%;font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;animation:newsTicker 16s linear infinite;}
@keyframes newsTicker{from{transform:translateX(0);}to{transform:translateX(-100%);}}
@media (prefers-reduced-motion: reduce){.news-ticker span{animation:none;}.news-live-dot::before{animation:none;}}
.news-shell .normal-day{margin:24px auto 28px;display:block;width:calc(100% - 52px);max-width:none;}
@media(max-width:600px){.news-headline{font-size:1.7rem;}.news-banner{font-size:1.1rem;}.news-body{padding:26px 18px 20px;}}


/* ---------- Uniform typography: one font family and one text size across every screen ---------- */
*, *::before, *::after{font-family:var(--font-sans)!important;}
body *{font-size:1rem!important;}
h1, .phone-header h1, .boss-name, .news-headline, .cert h1{font-size:1.5rem!important;}
h2{font-size:1.25rem!important;}
/* Emoji/icon graphics are pictures, not text, so they keep their visual size. */
.pile-icon,.keep-icon,.bucket-icon,.news-icon,.worried{font-size:2.4rem!important;}
.budget-visual.mini .pile-icon{font-size:3.6rem!important;}
.call-circle{font-size:2rem!important;}
.recent-icon,.zoom-tool span,.opt .radio,.keep-row .bucket-btn,.flying-dollar{font-size:1.4rem!important;}
.boss-avatar{font-size:5rem!important;} .boss-avatar.small{font-size:2.5rem!important;}
/* Step 2 allocation: a five-column grid (money pile + four categories) instead of absolutely
   positioned buckets, so the block takes its own height and never rides up into the text above
   it or into its neighbours. Labels get a fixed three-line slot so every control lines up. */
.budget-visual:not(.mini){display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end;height:auto;margin:28px 0 22px;padding-top:6px;}
.budget-visual:not(.mini) .pile,.budget-visual:not(.mini) .bucket{position:static;transform:none;width:auto!important;left:auto!important;}
.budget-visual:not(.mini) .pile{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
.budget-visual:not(.mini) .bucket-icon{margin-bottom:6px;}
.budget-visual:not(.mini) .bucket-btn{margin:6px auto;}
.budget-visual:not(.mini) .bucket-caption{min-height:2.8em;display:flex;align-items:flex-start;justify-content:center;line-height:1.35;margin-top:8px;overflow-wrap:anywhere;}
@media (max-width:600px){
  .budget-visual:not(.mini){grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
  .budget-visual:not(.mini) .pile{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;margin-bottom:10px;}
  .budget-visual:not(.mini) .bucket-caption{min-height:4.2em;overflow-wrap:normal;hyphens:auto;-webkit-hyphens:auto;}
}
/* ---------- Home page: role selection ---------- */
.role-grid{display:grid;gap:16px;margin-top:12px;}
@media (min-width:640px){.role-grid{grid-template-columns:1fr 1fr;}}
.role-card{border:2px solid var(--line);border-radius:8px;padding:18px;cursor:pointer;background:var(--card);transition:border-color .15s,background .15s;display:flex;flex-direction:column;}
.role-card:hover{border-color:var(--maroon);}
.role-card.chosen{border-color:var(--maroon);background:rgba(107,23,48,.06);box-shadow:0 0 0 3px rgba(107,23,48,.12);}
.role-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.role-icon{font-size:2.2rem!important;line-height:1;}
.role-head h3{margin:0;}
.role-pick{margin-left:auto;color:var(--maroon);font-weight:700;white-space:nowrap;}
.role-summary{margin:0 0 12px;color:var(--slate);}
.role-target{border-left:3px solid var(--gold);padding-left:10px;margin:0 0 12px;}
.inf-row{border-top:1px solid var(--line);padding:10px 0;}
.inf-row:last-child{padding-bottom:0;}
.inf-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;font-weight:700;}
.inf-badge{display:inline-block;border-radius:12px;padding:1px 10px;font-weight:700;border:1px solid currentColor;white-space:nowrap;}
.inf-Direct{color:var(--ok);} .inf-Shared{color:var(--warn);} .inf-Limited{color:var(--crit);}
.inf-can,.inf-cant{margin:2px 0;line-height:1.45;}
.inf-legend p{margin:4px 0;}
.auth-note{margin-top:6px!important;color:var(--warn)!important;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const app = document.getElementById('app');
const YEARS = [2026,2027,2028,2029,2030,2031];

// ======================= ROLES =======================
// Everything that differs between roles lives here. The shared world (enrollment, indicators,
// option banks, events, endings) is the same for every role; the role decides what the learner
// is accountable for, which moves they are allowed to make, and how they hear about problems.
//
// AUTHORITY MODEL (pedagogical estimate, informed by how ASU divides responsibility between
// Facilities Development & Management, the Fulton schools, and University Housing):
//   direct  — the role can do this itself; the option works at full strength.
//   shared  — the role can fund it, but another office must sign off and carry it out; the
//             option is offered, but its gains land at SHARED_EFFECT of full strength.
//   none    — outside the role's authority; the option is never offered to this role.

function classifyOption(cat, o){
  const t = o.title;
  if(TYPE_OVERRIDES[t]) return TYPE_OVERRIDES[t];
  if(/town hall|transparency report|trust campaign|satisfaction survey/i.test(t)) return 'comms';
  if(/roommate|rent-assistance|mediation|shuttle/i.test(t)) return 'housingOps';
  if(/\b(hire|hiring|recruit|adjunct|lecturers?|teaching-assistant|staffing|mentoring|lab-monitor)\b/i.test(t)) return 'hiring';
  if(/schedul|curriculum|class-size|course offerings|semester|summer-term|micro-credential|two-shift|guarantee seats|hybrid|forecasting|section offerings|co-locate courses|safety training|hackathon|competition/i.test(t)) return 'academic';
  if(/partner|negotiate|lease|block-lease|share |shared|co-fund|court industry|apply for|lobby|joint|national lab|equipment loan/i.test(t)) return 'partnership';
  if(cat==='labs' && /purchase|equipment|printers|laser|sensors|software|tools|hours/i.test(t)) return 'equipment';
  return 'construction';
}

function optionAuthority(cat, o){
  if(o.baseline) return 'direct';

  const byCat = (R().authorityByCategory[cat] || {})[type];

}
function optionPartner(cat, o){

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function pct(o){ return Math.min(100, Math.round((o.avail/o.req)*1000)/10); }
function status(p){ if(p>=90) return {t:'Excellent',c:'ok'}; if(p>=80) return {t:'Stable',c:'ok'}; if(p>=70) return {t:'Strained',c:'warn'}; if(p>=60) return {t:'Critical',c:'warn'}; return {t:'Failure',c:'crit'}; }
function barClass(p){ if(p>=80) return 'bar-ok'; if(p>=60) return 'bar-warn'; return 'bar-crit'; }
function overall(){ return (pct(S.academic)+S.facility+pct(S.labs)+pct(S.housing))/4; }

function applyHoldConsequence(){
  S.holdCount += 1;
  if(S.holdCount === 1){
    return " Because this year's allocation went unspent, the capital planning office has flagged the program for an obligation review — appropriated funds that go unused put next year's budget at risk.";
  }
  const cut = Math.min(S.capital, Math.round(S.capital*0.6)||10);
  S.capital = Math.max(0, S.capital - cut);
  return ` This is the second time capital has gone unspent. The university has reduced next cycle's allocation by $${cut}M in response — unspent public funds are treated as evidence the program doesn't need the money.`;
}

function buildConsequence(before, after, totalSpent){
  const lines = [
    craftSentence('academic', before.academic, after.academic),
    craftSentence('facility', before.facility, after.facility),
    craftSentence('labs', before.labs, after.labs),
    craftSentence('housing', before.housing, after.housing),
  ].filter(Boolean);
  if(lines.length === 0) lines.push("Nothing measurable changed across Fulton's systems this year.");
  if(totalSpent === 0) lines.push(applyHoldConsequence().trim());

    facility: after.facility-before.facility,
    labs: after.labs-before.labs,
    housing: after.housing-before.housing,

}

// A phone-call cost — whether an incoming crisis call or an outgoing call to Boss for
// instructions — is never allowed to end the game, at any point, on its own, whether it left
// capital negative (would-be "You're Fired") or exactly at zero with years still left
// (would-be "You're Reassigned"). There's a two-year recovery window (the call's year and the
// year right after it): if capital is rebuilt above zero by then, nothing happens. If it's
// still unresolved once that window has passed, the shortfall is written off outright rather
// than costing the role. Returns true if the ending currently being checked should be
// suppressed for this reason; false means it's a genuine, call-unrelated ending.
function callGraceSuppresses(){
  if(S.callDeficitYear === null) return false;
  const currentYear = YEARS[Math.min(Math.max(S.stage-1,0), YEARS.length-1)];
  if(currentYear <= S.callDeficitYear + 1) return true; // still inside the recovery window
  S.capital = 1; // written off; nominal $1M rather than an exact $0 so it can't misread as a clean finish
  S.callDeficitYear = null;
  return true;
}
function checkBreak(){
  if(S.stage===0) return null;
  if(!S.budgetPlanned) return null; // no game-over conditions apply during initial setup
  if(S.callDeficitYear !== null && S.capital > 0){
    // The call-induced shortfall has since been resolved through play (a grant, careful
    // spending) — clear the flag so it can't linger and shield some later, unrelated deficit.
    S.callDeficitYear = null;
  }
  if(S.capital<0){
    if(callGraceSuppresses()) return null;
    return {
      title:"You're Fired",
      reason:"Spending was approved across your decisions that added up to more than Fulton's available capital — a public institution cannot legally operate in deficit.",
      value:`Debt: $${Math.abs(S.capital).toFixed(0)}M`,
      consequence:"You have been removed from your position, effective immediately. The shortfall becomes a formal audit finding attached to your name."
    };
  }
  if(S.capital===0 && S.stage<5 && S.yearlyDecisionsMade>0){
    if(callGraceSuppresses()) return null;
    return {
      title:"You're Reassigned",
      reason:"You spent every dollar of your capital with time still left in your term, and real problems still unresolved.",
      value:"Capital remaining: $0M, years remaining in term",
      consequence:"University leadership has no confidence in a director who runs out of budget before the plan is finished. You're pulled from the role."
    };
  }
  if(S.facility<=0) return {title:'Facilities Collapse', msg:"Fulton's physical plant has failed completely. Buildings are no longer safe to occupy."};
  if(pct(S.academic)<=0) return {title:'Instructional Collapse', msg:'Instructional capacity has hit zero. There is nowhere left to hold class.'};
  if(pct(S.labs)<=0) return {title:'Lab & Makerspace Collapse', msg:'Every lab and makerspace has gone offline. Students and researchers have nowhere to work.'};
  if(pct(S.housing)<=0) return {title:'Housing Collapse', msg:'Housing capacity has hit zero. Every student who needed a bed has nowhere to live.'};
  return null;
}

function startSim(){

// ---------- Events (computed once per stage transition) ----------
function computeEvents(currentYear){
  let ev = [];

  // Delayed consequences: some decisions don't show their effect immediately — they were
  // scheduled to surface a year or two later, and when they do, the game explicitly calls
  // back to the year and choice responsible.
  const due = S.pendingDelayed.filter(p => p.triggerYear <= currentYear);
  S.pendingDelayed = S.pendingDelayed.filter(p => p.triggerYear > currentYear);
  due.forEach(p=>{
    if(p.fx.facility) S.facility = Math.min(100, Math.max(0, S.facility + p.fx.facility));
    if(p.fx.academicSqft) S.academic.avail = Math.max(0, S.academic.avail + Math.round(p.fx.academicSqft/100));
    if(p.fx.labsSqft) S.labs.avail = Math.max(0, S.labs.avail + p.fx.labsSqft);
    if(p.fx.housingBeds) S.housing.avail = Math.max(0, S.housing.avail + p.fx.housingBeds);
    ev.push({t:`Do you remember ${p.sourceYear}, when you chose "${p.title}"? ${p.note}`, bad:true});
  });

  const totalBefore = totalEnrollment();

  // Two real, distinct populations flow separately each year: incoming undergrads and departing
  // undergrad graduates on one side, and graduate students (fed partly by Fulton's own
  // undergrad graduates, partly by new outside admits) on the other. Each pool is tracked as
  // this year's newcomers (new undergrads / new grad admits) versus everyone who arrived in an
  // earlier year (former undergrads / former new admits, i.e. continuing students) — last
  // year's newcomers roll into the "former" pool before this year's newcomers arrive.
  // Rates are randomized within an estimated range each year — real enrollment doesn't move
  // in a straight line, so some years grow, some hold flat, and some years can even decline.
  const undergradGradRate = randomBetween(0.17,0.24);
  const undergradGrad = Math.round(S.undergradFormer * undergradGradRate);
  S.undergradFormer = Math.max(0, S.undergradFormer + S.undergradNew - undergradGrad);
  const newUndergrad = Math.round(randomBetween(4800,6800));
  S.undergradNew = newUndergrad;
  // 100% housing = enough beds for this year's incoming undergraduates, so the target moves with the cohort.
  const prevHousingReq = S.housing.req;
  S.housing.req = Math.max(1, S.undergradNew);

  const gradFromUndergrad = Math.round(undergradGrad * 0.08);
  const newGradExternal = Math.round(randomBetween(1400,2300));
  const gradGraduatingRate = randomBetween(0.24,0.33);
  const gradGraduating = Math.round(S.gradFormer * gradGraduatingRate);
  S.gradFormer = Math.max(0, S.gradFormer + S.gradNew - gradGraduating);
  S.gradNew = gradFromUndergrad + newGradExternal;

  const netChange = totalEnrollment() - totalBefore;
  S.academic.req = Math.max(0, S.academic.req + netChange);

  const trendPhrase = netChange > 50 ? `growing Fulton's total enrollment by about ${netChange.toLocaleString()} students`
    : netChange < -50 ? `shrinking Fulton's total enrollment by about ${Math.abs(netChange).toLocaleString()} students`
    : `leaving Fulton's total enrollment essentially flat compared to last year`;
  ev.push({t:`About ${newUndergrad.toLocaleString()} new undergrads enrolled and ${undergradGrad.toLocaleString()} former undergrads graduated this year — roughly ${gradFromUndergrad.toLocaleString()} of them continuing straight into Fulton graduate programs, alongside ${newGradExternal.toLocaleString()} newly admitted graduate students and ${gradGraduating.toLocaleString()} former graduate students completing their degrees — ${trendPhrase}.`, bad: netChange>=0});

  const bedGap = S.housing.req - S.housing.avail;
  ev.push({t:`This year's incoming class needs ${S.housing.req.toLocaleString()} beds (last year: ${prevHousingReq.toLocaleString()}). `
    + (bedGap > 0 ? `With ${S.housing.avail.toLocaleString()} beds available, about ${bedGap.toLocaleString()} new undergraduates are without on-campus housing.`
                  : `With ${S.housing.avail.toLocaleString()} beds available, every new undergraduate who needs a bed can have one.`),
    bad: bedGap > 0});

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  if(S.facility < 75 && Math.random() < 0.4){ S.facility=Math.max(0,S.facility-6); S.capital=Math.max(0,S.capital-6); ev.push({t:pick([
    'Aging systems in an under-maintained building required an unplanned $6M repair.',
    'A burst pipe in an older building forced an unplanned $6M emergency repair.',
    'An HVAC failure in a heavily-used building required an unplanned $6M fix.',
  ]), bad:true}); }
  if(pct(S.housing) < 80 && Math.random() < 0.35){ S.housing.avail=Math.max(0,S.housing.avail-250); ev.push({t:pick([
    'A residence hall needed repairs, temporarily removing 250 beds. First-year students are housed first, so pressure lands on continuing and graduate students.',
    'A plumbing failure took a residence hall wing offline, removing 250 beds. First-year students keep priority, so continuing students absorb the loss.',
    'Fire-safety code violations forced 250 beds out of service pending repairs, with first-year housing commitments protected first.',
  ]), bad:true}); }
  if(pct(S.academic) < 75 && pct(S.labs) < 80 && Math.random() < 0.3){ ev.push({t:pick([
    'Scheduling conflicts are increasing as classroom and lab demand both run tight at once.',
    'Department chairs report growing difficulty finding open classroom and lab slots in the same week.',
    'Students are reporting more schedule clashes as both classrooms and labs run near capacity.',
  ]), bad:true}); }
  if(S.facility < 60){ ev.push({t:pick([
    'A building system has failed. Instructional space is temporarily lost while it is repaired.',
    'An aging building was red-tagged after a system failure, pulling instructional space offline during repairs.',
    'An emergency closure took a portion of instructional space offline after a facility failure.',
  ]), bad:true}); S.facility=Math.max(0,S.facility-8); }
  if(pct(S.housing) < 70 && Math.random() < 0.4){ ev.push({t:pick([
    'Local coverage highlighted students commuting long distances due to limited on-campus housing.',
    'A news segment featured students describing hour-plus commutes because on-campus housing ran out.',
    'Student government raised commuting hardship as a recurring complaint tied to the housing shortage.',
  ]), bad:true}); }
  if(pct(S.academic) < 70 && Math.random() < 0.4){ ev.push({t:pick([
    'Students have raised concerns publicly about oversized lecture sections.',
    'Course evaluations increasingly cite overcrowded lecture halls as a problem.',
    'A student petition circulated calling for smaller class sizes in core courses.',
  ]), bad:true}); }
  if(S.facility >= 80 && Math.random() < 0.3){ ev.push({t:pick([
    'Facilities leadership received recognition for maintaining safe, well-kept buildings.',
    'An external accreditation review praised the condition of Fulton facilities.',
    'A campus safety audit cited Fulton buildings as a model for upkeep.',
  ]), bad:false}); }
  if(pct(S.labs) >= 85 && Math.random() < 0.3){ ev.push({t:pick([
    'Industry partners praised expanded access to hands-on lab space.',
    'A corporate sponsor highlighted Fulton\'s lab capacity when announcing a new partnership.',
    'Prospective students cited strong lab access as a reason for choosing Fulton.',
  ]), bad:false}); }

  // Each role hears about Fulton's problems through its own lens. The Facilities Director sees
  // shortages as space requests and work orders; the School Director sees them as academic and
  // research problems — including in areas the role doesn't control.
  if(S.role==='facilities'){
    if(pct(S.academic) < 75 && Math.random() < 0.4){ ev.push({t:pick([
      'The registrar asked your team to find swing classrooms for sections that have no room.',
      "Department chairs submitted a stack of urgent space requests your team can't review fast enough.",
      'Your crews are converting conference rooms into overflow classrooms between semesters.',
    ]), bad:true}); }
    if(pct(S.labs) < 80 && Math.random() < 0.35){ ev.push({t:pick([
      'Schools are asking your team to retrofit space for equipment that has nowhere to go.',
      "A research group's new equipment sat on a loading dock for months, waiting for a room with the right power and ventilation.",
    ]), bad:true}); }
    if(pct(S.housing) < 75 && Math.random() < 0.4){ ev.push({t:pick([
      'University Housing asked your team to fast-track repairs on residence hall rooms that are offline.',
      'Your crews were pulled off planned maintenance to turn over emergency housing.',
    ]), bad:true}); }
    if(S.facility >= 85 && Math.random() < 0.3){ ev.push({t:'Your project schedule came in on time again this year, and university leadership noticed.', bad:false}); }
  }
  if(S.role==='school' && S.facility < 70 && Math.random() < 0.4){ ev.push({t:pick([
    'Faculty in an aging building report that unreliable climate control ruined a semester of experimental data.',
    'Two department chairs asked to move core lab sections out of a building with recurring system failures.',
    'A faculty candidate declined your offer after touring the building where their lab would have been.',
  ]), bad:true}); }
  if(S.role==='school' && pct(S.housing) < 75 && Math.random() < 0.4){ ev.push({t:pick([
    'Several admitted graduate students in your programs declined their offers, citing the lack of affordable housing near campus.',
    'Advisors report first-year students in your programs missing early-morning labs because of long commutes.',
    'A new faculty hire asked to delay their start date because their incoming graduate students could not find housing.',
  ]), bad:true}); }
  if(S.role==='school' && pct(S.labs) < 80 && Math.random() < 0.35){ ev.push({t:pick([
    'Research groups are waiting months for bench space; two faculty members flagged delayed grant deliverables.',
    'Capstone teams report that makerspace reservations are booked out for weeks at a time.',
    'Students in FSE 100 sections are sharing 3D printers and laser cutters at ratios their instructors call unworkable.',
  ]), bad:true}); }
  if(S.role==='school' && pct(S.academic) >= 85 && pct(S.labs) >= 85 && Math.random() < 0.35){ ev.push({t:pick([
    'An ABET accreditation visit praised the alignment between your programs\' enrollment and their instructional resources.',
    'Two highly sought faculty candidates accepted offers, citing strong teaching and lab support.',
  ]), bad:false}); }

  if(S.role==='dean'){
    const low = ['academic','facility','labs','housing'].filter(k => indicatorValue(k) < 65);
    if(low.length && Math.random() < 0.45){ ev.push({t:pick([
      `The Provost asked for a written plan on ${CATEGORY_LABELS[low[0]].replace(/^\S+\s/,'')} before the next Regents meeting.`,
      'Two school directors told you privately that the college\'s priorities feel uneven.',
      'A major donor asked why one part of Fulton seems to be falling behind the others.',
    ]), bad:true}); }
    if(overall() >= 80 && Math.random() < 0.3){ ev.push({t:'The President highlighted Fulton as a model of managed growth in a speech to the Regents.', bad:false}); }
  }
  if(S.role==='sgp'){
    if(pct(S.housing) < 70 && Math.random() < 0.45){ ev.push({t:pick([
      'A student-led housing protest drew hundreds to the steps of the administration building.',
      'Students launched an online tracker of rent increases near campus and tagged your office in it.',
    ]), bad:true}); }
    if(pct(S.academic) < 75 && Math.random() < 0.4){ ev.push({t:'Students started a waitlist-sharing group to trade seats in required courses — and asked student government to make it official.', bad:true}); }
    if(pct(S.labs) < 80 && Math.random() < 0.35){ ev.push({t:'Club leaders say student teams are skipping competitions because they can\'t get build time.', bad:true}); }
    if(pct(S.housing) >= 75 && pct(S.labs) >= 80 && Math.random() < 0.3){ ev.push({t:'A student satisfaction survey hit a five-year high, and students credited student government by name.', bad:false}); }
  }
  if(S.role==='housing'){
    const gap = S.housing.req - S.housing.avail;
    if(gap > 1500 && Math.random() < 0.5){ ev.push({t:pick([
      `Your waitlist passed ${gap.toLocaleString()} students; staff are taking calls from families every hour.`,
      'Your team placed students in overflow rooms and lounges to get through the first weeks.',
    ]), bad:true}); }
    if(pct(S.academic) < 75 && Math.random() < 0.35){ ev.push({t:'Residents report long commutes across campus to the few sections they could get into.', bad:true}); }
    if(S.facility < 70 && Math.random() < 0.35){ ev.push({t:'Residents in halls next to aging academic buildings are complaining about construction noise and closures.', bad:true}); }
    if(gap <= 0 && Math.random() < 0.4){ ev.push({t:'For the first time in years, every new undergraduate who needed a bed got one.', bad:false}); }
  }

  // Flavor pool never repeats a line within the same playthrough, so five years never read
  // like the same two or three filler events on rotation.
  const flavorPool = R().flavorPool;
  const unused = flavorPool.filter(f => !S.usedFlavorEvents.has(f));
  const pool = unused.length ? unused : flavorPool;
  let guard = 0;
  while(ev.length < 2 && guard < 10){
    const pick = pool[Math.floor(Math.random()*pool.length)];
    if(!ev.some(e=>e.t===pick)){ ev.push({t:pick, bad: Math.random()<0.5}); S.usedFlavorEvents.add(pick); }
    guard++;
  }
  return ev;
}

// ---------- Year result (shown once, after committing, before moving on) ----------
function yearResultView(n){
  const year = YEARS[n-1];
  const events = S.currentEvents || [];
  const consequenceBlock = S.lastAction ? `<div class="card"><h3>Consequences of your ${S.lastAction.year} decision</h3><ul>${S.lastAction.lines.map(l=>`<li>${l}</li>`).join('')}</ul></div>${tickerHtml(S.lastAction.trends, S.lastAction.afterStats)}` : '';
  const eventsBlock = events.length? `<div class="card"><h3>Other developments this year</h3>${events.map(e=>`<div class="event ${e.bad?'bad':'good'}">${e.t}</div>`).join('')}</div>` : '';
  const nextLabel = n<5 ? `Continue to ${YEARS[n]}` : 'See the 2031 Final Results';
  return `
  <div class="masthead"><h1>Year ${year}</h1><span class="tag">Decision ${n} of 5 complete</span></div>
  ${dashboard(year)}
  ${piCard(true)}
  ${consequenceBlock}
  ${eventsBlock}
  <div class="card"><button onclick="advanceYear()">${nextLabel}</button></div>`;
}
function advanceYear(){
  S.showingResult = false;
  S.stage += 1;
  if(S.stage>=1 && S.stage<=5){
    categoryOrderThisYear = shuffleArray(['academic','facility','labs','housing']);
    generateYearOptions();
    categoryStep = 0;
    selections = {academic:null, facility:null, labs:null, housing:null};
    // An unannounced surprise event lands in each of S.surpriseEventYears (one or two of the
    // five decision years, chosen at the start of the game) — the student is never told this
    // is coming, or how many times it will happen.
    const thisYear = YEARS[S.stage-1];
    let willShowEvent = false;
    if(S.surpriseEventYears.includes(thisYear) && !S.surpriseEventsTriggeredYears.includes(thisYear)){
      S.surpriseEventsTriggeredYears.push(thisYear);
      S.surpriseCaller = null; // which identity calls is re-rolled each time; its portrait (once assigned) is not
      S.surpriseEventPending = generateSurpriseEvent();
      S.surpriseEventPhase = 'call';
      S.showingSurpriseEvent = true;
      willShowEvent = true;
    } else if(S.externalEventYears.includes(thisYear) && !S.externalEventsTriggeredYears.includes(thisYear)){
      // A natural or political development outside the learner's control — this time they
      // place the call, to Boss, for instructions on how Fulton should respond.
      S.externalEventsTriggeredYears.push(thisYear);
      S.externalEventPending = generateExternalEvent();
      S.externalEventPhase = 'notice';
      S.showingExternalEvent = true;
      willShowEvent = true;
    }
    // If a call is about to happen this year, its cost isn't known yet — capture the year's
    // starting capital only once the call has resolved (in closeSurpriseEvent /
    // closeExternalEvent), so the budget tracker and affordability math reflect the call's
    // real effect on this year's money.
    if(!willShowEvent) S.yearStartCapital = S.capital;
  }
  render();
  scrollToTop();
}

// ---------- Surprise event: an unplanned call mid-game, 70% bad / 30% good ----------
const SURPRISE_MAGNITUDE = {academic:1200000, facility:9, labs:18000, housing:180};
function generateSurpriseEvent(){
  const categories = ['academic','facility','labs','housing'];
  const category = categories[Math.floor(Math.random()*categories.length)];
  const isGood = Math.random() < 0.30; // 70% bad, 30% good
  return {
    category,
    isGood,
    narrative: R().surprise[category][isGood ? 'good' : 'bad'],
    magnitude: SURPRISE_MAGNITUDE[category],
  };
}
function applyCategoryDelta(category, amount){
  if(category==='facility') S.facility = Math.min(100, Math.max(0, S.facility + amount));
  if(category==='academic') S.academic.avail = Math.max(0, S.academic.avail + Math.round(amount/100));
  if(category==='labs') S.labs.avail = Math.max(0, S.labs.avail + amount);
  if(category==='housing') S.housing.avail = Math.max(0, S.housing.avail + amount);
}
// A surprise phone call can force a spending decision with no time to plan around the
// budget. The "You're Fired" bankruptcy check (S.capital<0) is never allowed to trigger from
// one of these calls: if the call's cost would push capital below zero, that one-time deficit
// is forgiven and capital is held at $0 instead. The forgiveness, when it happens, is reported
// back in the phone-consequence text rather than silently absorbed.
// A surprise phone call can force a spending decision with no time to plan around the
// budget. Rather than clamp the cost at $0 capital, the call is allowed to push capital into
// a real deficit — but the "You're Fired" bankruptcy check (see checkBreak) grants a grace
// period for it: it won't end the game during the same year the call happened, only once a
// new year's decisions begin and the deficit is still unresolved. That grace window is
// recorded here via S.callDeficitYear so checkBreak knows which year to forgive.
// A surprise phone call — incoming or outgoing — can force a spending decision with no time
// to plan around the budget. Rather than clamp the cost at $0 capital, the call is allowed to
// push capital into a real deficit — but per checkBreak, that deficit can NEVER end the game
// on its own. It has two years to be recovered (the call's year and the year after); if it
// still isn't by then, the debt is simply written off. That grace window is tracked here via
// S.callDeficitYear so checkBreak knows which year to measure from.
function chargeCallCost(cost){
  if(!cost) return '';
  const wouldBe = S.capital - cost;
  S.capital = wouldBe;
  if(wouldBe <= 0){
    const callYear = YEARS[S.stage-1];
    S.callDeficitYear = callYear;
    if(wouldBe < 0){
      return ` This response pushed capital $${Math.abs(wouldBe)}M into deficit. Recovering it by the end of ${callYear+1} keeps it off your record; if it's still outstanding after that, the debt will simply be written off rather than costing you the role.`;
    }
    return ` This response used the last of this year's capital, leaving nothing to spare. Rebuilding it above zero by the end of ${callYear+1} keeps it off your record; if it's still at zero after that, it will simply be forgiven rather than costing you the role.`;
  }
  return '';
}

// that identity ever appears, and then reused every later time that same identity calls —

function resolveSurpriseEvent(choice){
  const ev = S.surpriseEventPending;
  if(choice==='hang'){
    const caller=currentCaller();
    const beforePhone = {academic:pct(S.academic), facility:S.facility, labs:pct(S.labs), housing:pct(S.housing), capital:S.capital};
    const labels = {academic:'Instructional & Faculty Space', facility:'Existing Facilities', labs:'Makerspaces & Laboratories', housing:'Student Housing'};
    if(ev.isGood){
      // A missed good call does not damage the current status; it erases a one-time upside.
      const potentialRaw = ev.category==='facility' ? ev.magnitude : (ev.category==='academic' ? (ev.magnitude/100)/S.academic.req*100 : ev.category==='labs' ? ev.magnitude/S.labs.req*100 : ev.magnitude/S.housing.req*100);
      const potentialPct = Math.max(0.1, potentialRaw * randomBetween(0.85,1.15));
      S.phoneConsequence = {
        tone:'missed', icon:'↗', title:'Opportunity missed', category:labels[ev.category],
        detail:`No immediate score changed, but the missed call forfeited an estimated +${potentialPct.toFixed(1)} percentage-point opportunity in ${labels[ev.category]}.`,
        delta:`Potential benefit lost: +${potentialPct.toFixed(1)} pts`, year:YEARS[S.stage-1]
      };
      S.surpriseOutcomeText = voicemailCopy(caller, ev, true, 0);
    } else {
      // Ignoring a bad event doubles its base damage; execution varies slightly so identical event types are not perfectly deterministic.
      const damageMultiplier = 2 * randomBetween(0.90,1.10);
      applyCategoryDelta(ev.category, -(ev.magnitude*damageMultiplier));
      const emergencyCost = Math.random()<0.45 ? [3,5,7][Math.floor(Math.random()*3)] : 0;
      const forgiveNote = chargeCallCost(emergencyCost);
      const afterPhone = {academic:pct(S.academic), facility:S.facility, labs:pct(S.labs), housing:pct(S.housing), capital:S.capital};
      const pointLoss = Math.max(0, beforePhone[ev.category]-afterPhone[ev.category]);
      const moneyText = emergencyCost>0 ? ` An additional $${emergencyCost}M emergency response was charged to capital.${forgiveNote}` : '';
      S.phoneConsequence = {
        tone:'bad', icon:'↓', title:'Consequence of the missed call', category:labels[ev.category],
        detail:`${labels[ev.category]} fell by ${pointLoss.toFixed(1)} percentage points because the issue went unanswered.${moneyText}`,
        delta:`${pointLoss.toFixed(1)} pts lost${emergencyCost>0 ? ` · $${emergencyCost}M unplanned cost` : ''}`, year:YEARS[S.stage-1]
      };
      S.surpriseOutcomeText = voicemailCopy(caller, ev, false, emergencyCost);
    }
    S.surpriseEventPhase = 'missedCall';
    render();
    scrollToTop();
    return;
  }
  S.surpriseEventPhase = ev.isGood ? 'goodChoice' : 'badChoice';
  render();
  scrollToTop();
}

// Every control (the 4 spending categories plus "keep") knows which visual container it
// lives in and where its own pile/bag sits, so dollars can fly both ways: out of the pile
// on increase, back into it on decrease.

  reno: {icon:'🏢', label:'Existing Facilities', pos:30, containerId:'budgetVisual', pilePos:10},

const BUCKET_META = {reno: CONTROL_META.reno, academic: CONTROL_META.academic, labs: CONTROL_META.labs, housing: CONTROL_META.housing};
const STEP = 5;
function bucketInner(key, meta){

function budgetVisual(cap){

function animateDollar(key, direction){
  // The $ travels between the money bag and the category's bar (the fill track under the +
  // button): bag → bar when money is added, bar → bag when it is taken back out. Positions are
  // measured from the live layout, so the path stays correct on desktop, phone, and the
  // "Keep for later" row alike.
  const meta = CONTROL_META[key];
  const container = document.getElementById(meta.containerId);
  if(!container) return;
  const bag = container.querySelector('.pile-icon');
  const barFill = document.getElementById(key+'-bar');
  const bar = barFill ? barFill.parentElement : null;
  if(!bag || !bar) return;
  const c = container.getBoundingClientRect();
  const centre = el => { const r = el.getBoundingClientRect(); return {x: r.left - c.left + r.width/2, y: r.top - c.top + r.height/2}; };
  const from = direction==='in' ? centre(bag) : centre(bar);
  const to = direction==='in' ? centre(bar) : centre(bag);
  const span = document.createElement('span');
  span.textContent = '$';
  span.className = 'flying-dollar';
  span.style.left = from.x + 'px';
  span.style.top = from.y + 'px';
  span.style.opacity = '1';
  container.appendChild(span);
  span.getBoundingClientRect(); // commit the start position so the transition runs
  requestAnimationFrame(()=>{
    span.style.left = to.x + 'px';
    span.style.top = to.y + 'px';
    span.style.opacity = direction==='in' ? '0.15' : '0';
  });
  setTimeout(()=>{ if(span.parentNode) span.parentNode.removeChild(span); }, 650);
}
function adjustAlloc(key, delta){
  setAlloc(key, alloc[key] + delta);
}
function setAlloc(key, requested){
  const othersSum = Object.keys(alloc).reduce((s,k)=> k===key? s : s+alloc[k], 0);
  const maxAllowed = Math.max(0, S.capital - othersSum);
  const previous = alloc[key];
  const clamped = Math.max(0, Math.min(requested, maxAllowed));
  if(clamped === previous) return;
  alloc[key] = clamped;
  // Patch the DOM directly instead of re-rendering the whole page on every click —
  // rebuilding innerHTML mid-interaction is what used to make controls feel laggy.
  const amt = document.getElementById(key+'-amt');
  if(amt) amt.textContent = '$'+clamped+'M';
  const bar = document.getElementById(key+'-bar');
  if(bar){
    if(key==='keep') bar.style.width = Math.min(100, Math.round((clamped/S.capital)*100)) + '%';
    else bar.style.height = Math.min(100, Math.round((clamped/60)*100)) + '%';
  }
  const total = Object.keys(alloc).reduce((s,k)=>s+alloc[k],0);
  const remainEl = document.getElementById('allocRemain');
  if(remainEl) remainEl.textContent = total<S.capital
    ? `Allocated: $${total}M of $${S.capital}M — $${S.capital-total}M is still unassigned and will be lost if you confirm without allocating it (spend it or move it into "Keep for later" above).`
    : `Allocated: $${total}M of $${S.capital}M — fully allocated.`;
  if(CONTROL_META[key]) animateDollar(key, clamped > previous ? 'in' : 'out');
  const pileLabel = document.getElementById('pileLabel');
  if(pileLabel) pileLabel.textContent = '$'+(S.capital-total)+'M left';
  const keepPileLabel = document.getElementById('keepPileLabel');
  if(keepPileLabel) keepPileLabel.textContent = '$'+(S.capital-total)+'M left';
}

function commitBudgetPlanning(){
  const before = {academic:pct(S.academic), facility:S.facility, labs:pct(S.labs), housing:pct(S.housing)};
  const spentNow = alloc.reno + alloc.academic + alloc.labs + alloc.housing;
  // Capital carried into 2026 is only what was explicitly assigned somewhere — spent on a
  // category, or deliberately moved into "Keep for later." Anything left unassigned across
  // all five sliders is not a safety margin; it's budget nobody claimed, and it's lost rather
  // than quietly carried forward.
  const totalAllocated = spentNow + alloc.keep;
  const unallocated = Math.max(0, S.capital - totalAllocated);
  S.capital = alloc.keep;
  // The baseline itself is fixed and real, but how well this first round of spending actually
  // executes is not — real projects run ahead of or behind their planning estimate. Each
  // category that received money gets its own random execution efficiency (85%-115% of the
  // planning formula); a category left at $0 gets no randomness applied at all, since nothing
  // was actually spent there. This is what makes every 2026 starting point unique, tied
  // directly to the choices just made rather than to chance alone.
  const eff = (amt) => amt>0 ? randomBetween(0.85,1.15) : 1;
  const renoEff = eff(alloc.reno), academicEff = eff(alloc.academic), labsEff = eff(alloc.labs), housingEff = eff(alloc.housing);
  S.facility = Math.min(100, Math.max(0, S.facility + (alloc.reno/4)*renoEff));
  S.academic.avail = Math.max(0, S.academic.avail + Math.round(((alloc.academic*1000000/250)/100)*academicEff));
  S.labs.avail = Math.max(0, S.labs.avail + Math.round((alloc.labs*1000000/475)*labsEff));
  S.housing.avail = Math.max(0, S.housing.avail + Math.round((alloc.housing*1000000/75300)*housingEff));
  const after = {academic:pct(S.academic), facility:S.facility, labs:pct(S.labs), housing:pct(S.housing)};
  const lines = [
    craftSentence('academic', before.academic, after.academic),
    craftSentence('facility', before.facility, after.facility),
    craftSentence('labs', before.labs, after.labs),
    craftSentence('housing', before.housing, after.housing),
  ].filter(Boolean);
  if(lines.length === 0) lines.push("Your starting allocation left Fulton's systems essentially where they began.");
  const investedNow = spentNow;
  if(investedNow === 0){
    lines.push(applyHoldConsequence().trim());
  }
  if(unallocated > 0){
    lines.push(`$${unallocated}M of your starting budget was never assigned to a category — spent or deliberately kept — so it lapsed before 2026 began: as though the allocation paperwork wasn't read closely enough, that funding is gone and won't be available to operate with.`);
  }
  S.budgetSummaryLines = lines;
  alloc = {reno:0, academic:0, labs:0, housing:0, keep:0};
  S.budgetPlanned = true;
  S.showingBudgetSummary = true;
  render();
  scrollToTop();
}

// Every decision offers exactly three options: two drawn from the four general dimensions of
// ASU's Principled Innovation framework (Moral, Civic, Intellectual, Performance), plus one
// choice not to spend money in that situation. Each dimension carries its own trade-off.
const DIM_ORDER = ['Moral','Civic','Intellectual','Performance'];
const DIM_INFO = {
  Moral: {icon:'⚖️'},
  Civic: {icon:'🏛️'},
  Intellectual: {icon:'🧠'},
  Performance: {icon:'🚀'},
  NoSpend: {icon:'⏸️', label:'No spending'},
};
// Money is shown in whole $M, or to the nearest $0.5M for small scaled costs.
function fmtM(x){ const r = Math.round(x*2)/2; return Number.isInteger(r) ? String(r) : r.toFixed(1); }
// ---------- Budget-scaled option costs ----------
// Bank costs are written on a reference scale where $25M is the largest single move. Each year,
// every option is re-priced against what you actually have: the largest move costs one year's
// "even pace" (capital at the start of the year divided by the decision years left, including
// this one). Effects scale by the same factor, so value-per-dollar is unchanged — a bigger
// budget simply buys bigger versions of the same moves. Choosing the biggest move in every
// category spends several years of pace at once, so running out of money is still possible.
const REFERENCE_MAX_COST = 25;
function yearPace(n){ const yearsLeft = Math.max(1, 6 - n); return Math.max(0, S.yearStartCapital) / yearsLeft; }
function scaleOption(o, n){
  if(o.baseline || o.cost===0) return Object.assign({}, o);
  const target = o.cost / REFERENCE_MAX_COST * yearPace(n);
  const cost = Math.max(1, target < 10 ? Math.round(target*2)/2 : Math.round(target));
  const k = cost / o.cost;
  const scaleFx = fx => {
    const out = {};
    Object.keys(fx||{}).forEach(f=>{
      out[f] = f==='facility' ? Math.round(fx[f]*k*10)/10 : Math.round(fx[f]*k);
    });
    return out;
  };
  const scaled = Object.assign({}, o, {cost, fx: scaleFx(o.fx), refTitle: o.title});
  if(o.delayed) scaled.delayed = Object.assign({}, o.delayed, {fx: scaleFx(o.delayed.fx)});
  return scaled;
}

// Bed gains in the option bank are multiplied by HOUSING_BED_MULTIPLIER when the page loads.
// With housing measured against the full incoming class (6,000+ new undergrads) and starting
// from the baseline 3,500 beds, the original bed counts made housing nearly impossible to
// recover for any role. Bed losses (side effects) are left unchanged.
const HOUSING_BED_MULTIPLIER = 2;
Object.values(CATEGORY_BANKS).forEach(bank => bank.forEach(o => {
  if(o.fx && o.fx.housingBeds > 0) o.fx.housingBeds = Math.round(o.fx.housingBeds * HOUSING_BED_MULTIPLIER);
}));

// Each year, every category shows exactly three options: one option from each of two Principled
// Innovation dimensions drawn at random (out of Moral, Civic, Intellectual, Performance), plus the
// category's guaranteed no-spend choice. A title is never shown twice in the same playthrough
// while the pool for that dimension still has fresh options, so the menu doesn't repeat itself.
let yearOptionPicks = {academic:[], facility:[], labs:[], housing:[]};
let usedOptionTitles = {academic:new Set(), facility:new Set(), labs:new Set(), housing:new Set()};
// Options are priced ONCE per year, from the capital available at the start of that year (after
// any phone call has resolved). Prices never change mid-year, and nothing is hidden or swapped
// based on what's left after earlier categories, so over-committing is possible and can end in
// "You're Fired" (deficit) or "You're Reassigned" (exactly $0 with years left).
let yearOptionsPriced = false;
function dimPool(key, dim){
  // Only moves inside this role's authority are ever offered.
  const bank = CATEGORY_BANKS[key].filter(o => o.dim===dim && optionAuthority(key, o)!=='none');
  const fresh = bank.filter(o => !usedOptionTitles[key].has(o.title));
  return fresh.length ? fresh : bank;
}
function generateYearOptions(){
  Object.keys(CATEGORY_BANKS).forEach(key=>{
    const baseline = Object.assign({authority:'direct'}, CATEGORY_BANKS[key].find(o=>o.baseline));
    const availableDims = DIM_ORDER.filter(d => dimPool(key, d).length);
    const dims = shuffleArray(availableDims).slice(0,2);
    const picks = dims.map(dim=>{
      const o = shuffleArray(dimPool(key, dim))[0];
      usedOptionTitles[key].add(o.title);
      const authority = optionAuthority(key, o);
      return Object.assign({}, o, {authority, partner: authority==='shared' ? optionPartner(key, o) : null});
    });
    yearOptionPicks[key] = [...picks, baseline];
  });
  yearOptionsPriced = false;
}
// A move that needs another office's sign-off still costs the full price, but its gains land at
// SHARED_EFFECT strength (coordination, competing priorities, someone else's schedule). Side
// effects and delayed consequences are NOT reduced — the downside arrives in full.
function applyAuthority(o){
  if(o.authority!=='shared') return Object.assign({mult:1}, o);
  const fx = {};
  Object.keys(o.fx||{}).forEach(f=>{
    const v = o.fx[f];
    fx[f] = v>0 ? (f==='facility' ? Math.round(v*SHARED_EFFECT*10)/10 : Math.round(v*SHARED_EFFECT)) : v;
  });
  return Object.assign({}, o, {fx, mult:SHARED_EFFECT});
}
function priceYearOptions(n){
  Object.keys(yearOptionPicks).forEach(key=>{
    const scaled = yearOptionPicks[key].map(o => applyAuthority(scaleOption(o, n)));
    const baseline = scaled.find(o=>o.baseline);
    const dims = scaled.filter(o=>!o.baseline).sort((a,b)=>a.cost-b.cost);
    yearOptionPicks[key] = [...dims, baseline];
  });
  yearOptionsPriced = true;
}

function buildCategories(){
  const cats = {};
  Object.keys(CATEGORY_LABELS).forEach(key=>{
    cats[key] = {label: CATEGORY_LABELS[key], options: yearOptionPicks[key]};

}

  return `<div class="card">
    <h3>💰 Budget Tracker</h3>
    <div class="stat-row"><div class="stat-label">Starting this year</div><div class="stat-val">$${fmtM(S.yearStartCapital)}M</div></div>
    <div class="stat-row"><div class="stat-label">Committed so far (${chosen}/4)</div><div class="stat-val">$${fmtM(spent)}M</div></div>
    <div class="stat-row" style="border-top:1px solid var(--line);padding-top:8px;margin-top:2px;"><div class="stat-label"><strong>Projected remaining</strong></div><div class="stat-val ${cls}"><strong>$${fmtM(projected)}M</strong></div></div>
    <p class="note">Updates live as you choose. Not final until you commit the year.</p>
    <div style="border-top:1px solid var(--line);padding-top:10px;margin-top:4px;">
      <h3 style="margin-bottom:6px;">🎯 Your Role Target</h3>
      <div><strong>${R().icon} ${R().title}</strong></div>
      <p style="margin:4px 0 0;">${R().targetText}</p>
    </div>
  </div>${piCard(false)}`;
}
function phoneConsequenceYearCard(){
  const c = S.phoneConsequence;
  if(!c || c.year!==YEARS[S.stage-1]) return '';
  const border = c.tone==='bad' ? 'var(--crit)' : (c.tone==='good' ? 'var(--ok)' : 'var(--warn)');
  return `<div class="card" style="border-left:5px solid ${border};">
    <div style="display:flex;gap:12px;align-items:flex-start;">
      <div style="font-size:1.8rem;line-height:1;">${c.icon}</div>
      <div><h3 style="margin-bottom:4px;">Phone call consequence</h3>
      <div style="font-weight:700;margin-bottom:5px;">${c.category}</div>
      <p style="margin:0 0 7px;">${c.detail}</p>
      <div style="font-size:.82rem;font-weight:700;color:${border};">${c.delta}</div></div>
    </div>
  </div>`;
}

function optionStageView(n, year){
  const key = categoryOrderThisYear[categoryStep];
  // Only count what's been spent in OTHER categories this year — the current category's own
  // selection must not count against itself.
  const spentSoFar = Object.keys(selections).reduce((sum,k)=> (k!==key && selections[k]!==null) ? sum + yearOptionPicks[k][selections[k]].cost : sum, 0);
  const remainingBudget = S.capital - spentSoFar;
  // Price the whole year's options once, the first time any decision of the year is shown.
  if(!yearOptionsPriced) priceYearOptions(n);
  const cats = buildCategories();
  const group = cats[key];
  const isLast = categoryStep === categoryOrderThisYear.length-1;
  const canAdvance = selections[key] !== null;
  const cards = group.options.map((o, idx)=>{
    const chosen = selections[key]===idx;
    const info = o.baseline ? DIM_INFO.NoSpend : DIM_INFO[o.dim];
    const dimLabel = o.baseline ? DIM_INFO.NoSpend.label : o.dim;
    const badgeColor = o.baseline ? 'var(--slate)' : 'var(--maroon)';
    const dimBadge = !o.baseline ? '' : `<span style="display:inline-block;font-size:.72rem;font-weight:700;color:${badgeColor};border:1px solid ${badgeColor};border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap;">${info.icon} ${dimLabel}</span>`;
    const authBadge = o.authority==='shared' ? `<span style="display:inline-block;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap;">🤝 Shared</span>` : '';
    return `<div class="opt ${chosen?'chosen':''}" onclick="selectOption('${key}',${idx})">
      <span class="radio">${chosen?'●':'○'}</span>
      <div class="body"><h4>${o.title} ${o.cost>0?`— $${fmtM(o.cost)}M`:'— no cost'}${dimBadge}${authBadge}</h4><p>${o.desc}</p></div>
    </div>`;
  }).join('');
  const progress = categoryOrderThisYear.map((k,i)=>{
    const done = selections[k]!==null;
    const active = i===categoryStep;
    const dot = active? '●' : (done? '✓' : '○');
    const color = active? 'var(--maroon)' : (done? 'var(--ok)' : 'var(--slate)');
    return `<span style="color:${color};font-weight:${active?700:400};margin-right:14px;font-size:.8rem;">${dot} ${CATEGORY_ORDER_LABELS[k]}</span>`;
  }).join('');
  const flavorBlock = categoryStep===0 ? `<div class="card"><p>${R().yearFlavor[n]}</p></div>` : '';
  const finalYearWarning = n===5 ? `<p class="keyinfo">This is your last chance to spend down this budget. As a public institution, every dollar you were appropriated is expected to go to work — leaving millions unspent by 2031 draws government scrutiny, not praise. Aim to finish with cents on the dollar remaining, not millions.</p>` : '';
  const statusBlock = dashboard(year);
  return `
  <div class="layout">
  <div>
  <div class="masthead"><h1>Year ${year}</h1><span class="tag">Decision ${n} of 5</span></div>
  ${flavorBlock}
  ${finalYearWarning}
  ${phoneConsequenceYearCard()}
  ${statusBlock}
  <div class="card">
    <div style="margin-bottom:14px;">${progress}</div>
    <h3>${group.label}</h3>
    <p class="note">Your authority here: <span class="inf-badge inf-${R().influence[key].level}">${R().influence[key].level}</span></p>
    <p class="note">${CATEGORY_HEADINGS[n]} ${remainingBudget<0 ? `Capital is currently $${fmtM(Math.abs(remainingBudget))}M in deficit.` : `You have $${fmtM(remainingBudget)}M left this year.`} Once you commit a category, it's locked in — there's no going back to change it.</p>
    ${cards}
    <div style="display:flex;justify-content:flex-end;margin-top:8px;">
      ${isLast
        ? `<button ${!canAdvance?'disabled':''} onclick="commitCategories(${n})">Commit ${year}</button>`
        : `<button ${!canAdvance?'disabled':''} onclick="goNextCategory()">Next</button>`}
    </div>
  </div>
  </div>
  <div class="sidebar">${budgetSidebar()}</div>
  </div>`;
}
const CATEGORY_ORDER_LABELS = {academic:'Academic', facility:'Facility', labs:'Labs', housing:'Housing'};
function selectOption(key, idx){ selections[key] = idx; render(); }
function goNextCategory(){ if(categoryStep < categoryOrderThisYear.length-1) categoryStep++; render(); scrollToTop(); }

function commitCategories(n){
  const cats = buildCategories();
  const before = {academic:pct(S.academic), facility:S.facility, labs:pct(S.labs), housing:pct(S.housing)};
  let totalCost = 0; let specialNotes = [];
  const piGain = {Moral:0, Civic:0, Intellectual:0, Performance:0, NoSpend:0};
  Object.keys(cats).forEach(key=>{
    const o = cats[key].options[selections[key]];
    totalCost += o.cost;
    // Principled Innovation profile: not scored, just a record of the kinds of choices made.
    const dimKey = o.baseline ? 'NoSpend' : o.dim;
    S.pi[dimKey]++; piGain[dimKey]++;
    if(o.fx.facility) S.facility = Math.min(100, Math.max(0, S.facility + o.fx.facility));
    if(o.fx.academicSqft) S.academic.avail = Math.max(0, S.academic.avail + Math.round(o.fx.academicSqft/100));
    if(o.fx.labsSqft) S.labs.avail = Math.max(0, S.labs.avail + o.fx.labsSqft);
    if(o.fx.housingBeds) S.housing.avail = Math.max(0, S.housing.avail + o.fx.housingBeds);
    if(o.delayed){
      S.pendingDelayed.push({triggerYear: YEARS[n-1] + o.delayed.years, sourceYear: YEARS[n-1], title: o.title, fx: o.delayed.fx, note: o.delayed.note});
    }
    if(o.special==='cityLobby'){
      if(Math.random()<0.4){ const amt = Math.round(15*(o.mult||1)); S.capital += amt; specialNotes.push(`The city council approved supplemental funding — an additional $${amt}M has been added to available capital.`); }
      else specialNotes.push('The city council took the funding request under advisement; nothing materialized this cycle.');
    }
    if(o.special==='industryDonation'){
      if(Math.random()<0.4){ S.labs.avail += Math.round(15000*(o.mult||1)); specialNotes.push('An industry partner donated equipment, modestly expanding lab capacity at no cost.'); }
      else specialNotes.push('Industry outreach continued, but no equipment donations came through this cycle.');
    }
    if(o.special==='federalGrant'){
      if(Math.random()<0.4){ S.labs.avail += Math.round(20000*(o.mult||1)); specialNotes.push('The federal infrastructure grant was awarded, meaningfully expanding lab capacity at no direct cost.'); }
      else specialNotes.push('The grant application was not selected this cycle.');
    }
  });
  S.piLastYear = piGain;
  S.capital = Math.round((S.capital - totalCost)*2)/2;
  // A year in which nothing at all is spent carries a heavy operational penalty: every one of
  // Fulton's four statuses loses 20% of its current value, on top of the budget-review
  // consequence in applyHoldConsequence. Problems don't pause while capital sits idle.
  if(totalCost === 0){
    S.facility = Math.max(0, Math.round(S.facility*0.8*10)/10);
    S.academic.avail = Math.max(0, Math.round(S.academic.avail*0.8));
    S.labs.avail = Math.max(0, Math.round(S.labs.avail*0.8));
    S.housing.avail = Math.max(0, Math.round(S.housing.avail*0.8));
    specialNotes.push("Because nothing was spent this year, every part of Fulton lost ground: instructional space, facility condition, labs, and housing each fell by 20% as demand kept growing and aging systems went unaddressed.");
  }
  S.yearlyDecisionsMade += 1;
  const after = {academic:pct(S.academic), facility:S.facility, labs:pct(S.labs), housing:pct(S.housing)};
  const {lines, trends, afterStats} = buildConsequence(before, after, totalCost);
  const fullLines = lines.concat(specialNotes);
  S.lastAction = {year:YEARS[n-1], lines: fullLines, trends, afterStats};
  selections = {academic:null, facility:null, labs:null, housing:null};
  categoryStep = 0;
  S.currentEvents = computeEvents(YEARS[n-1]);
  S.showingResult = true;
  render();
  scrollToTop();
}

// ---------- Outcome (2031) ----------
function outcomeView(){
  const role = R();
  const ov = overall();
  const targetKeys = role.targets.map(t=>t.key);
  const targetMet = role.targets.every(t => indicatorValue(t.key) >= t.min);
  const floorMet = pct(S.academic)>=60 && S.facility>=60 && pct(S.labs)>=60 && pct(S.housing)>=60;
  const overallMet = ov >= 75;
  const spentEnough = S.capital <= 15;
  const passed = targetMet && floorMet && spentEnough;
  const unspentNote = S.capital > 15
    ? `<p class="note">⚠ $${S.capital.toFixed(0)}M of appropriated capital went unspent by 2031. Institutionally, that's not a safety margin — it's evidence to the university and its funders that the program didn't need what it asked for. This finding alone is enough to miss your role target, regardless of your indicator scores.</p>`
    : '';
  const rowLabels = {academic:'Academic Capacity', facility:'Facility Condition', labs:'Labs &amp; Makerspaces', housing:'Housing Capacity'};
  const rows = ['academic','facility','labs','housing'].map(k=>{
    const t = role.targets.find(x=>x.key===k);
    const v = indicatorValue(k);
    return t ? `<div>${rowLabels[k]} (target ≥${t.min}%)</div><div class="${v>=t.min?'ok':'crit'}">${v.toFixed(1)}%</div>`
             : `<div>${rowLabels[k]}</div><div>${v.toFixed(1)}%</div>`;
  }).join('\n      ');
  return `
  <div class="masthead"><h1>Fulton 2031 — Final State</h1><span class="tag">${role.title}</span></div>
  ${dashboard(2031)}
  ${unspentNote}
  ${piCard(false)}
  <div class="card cert">
    <h1>Certificate of Completion</h1>
    <div class="role">Fulton 2031 Capital Planning Simulation</div>
    <div style="font-family:var(--font-serif);font-size:1.3rem;">${S.name}</div>
    <div class="cert-grid">
      <div>Role</div><div>${role.title}</div>
      ${rows}
      ${(()=>{const t=role.targets.find(x=>x.key==='overall'); return t ? `<div>Fulton Overall (target ≥${t.min}%)</div><div class="${ov>=t.min?'ok':'crit'}">${ov.toFixed(1)}%</div>` : `<div>Fulton Overall</div><div>${ov.toFixed(1)}%</div>`;})()}
      <div>Strongest PI dimension (not scored)</div><div>${(()=>{const mx=Math.max(...DIM_ORDER.map(d=>S.pi[d])); return mx? DIM_ORDER.filter(d=>S.pi[d]===mx).map(d=>DIM_INFO[d].icon+' '+d).join(' / ') : '—';})()}</div>
      <div>Minimum-floor rule (no area &lt;60%)</div><div class="${floorMet?'ok':'crit'}">${floorMet?'Met':'Not met'}</div>
      <div>Capital obligation (spent within $15M of budget)</div><div class="${spentEnough?'ok':'crit'}">${spentEnough?'Met':'Flagged for review'}</div>
    </div>
    <div class="verdict ${passed?'pass':'fail'}">${passed?'✓ Role Target Achieved':'✗ Role Target Not Achieved'}</div>
    <p class="note" style="text-align:left;">Overall Fulton Performance ${overallMet?'met':'did not meet'} the university-wide success bar of 75%. Your role-specific bar (${role.targetText.replace(' by 2031.','')}) governs your personal result above.</p>
  </div>
  <div class="card">
    <h3>Written reflection (homework)</h3>
    <p>${role.reflection}</p>
  </div>
  <div class="card"><button onclick="retrySim()">Play again — choose a role</button></div>`;
}

render();
</script>
